[package]
name = "simulator"
version = "0.1.0"
edition = "2024"
description = "Slime's Revenge design guard: plays fights by the design rules and reports which builds work where"
license = "UNLICENSED"
publish = false

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", features = ["preserve_order"] }

# The tests run the whole matrix several times; unoptimized it takes ~40 s.
[profile.test]
opt-level = 3
