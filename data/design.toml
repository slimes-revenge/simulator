# The build x encounter matrix.
[matrix]
seeds = 50                    # seeds 0..seeds-1 per cell
action_points = [1, 2]        # 1 = the game today, 2 = the design (turn-structure.md)
pure_build_units = 10         # one pure build per liquid
enemy_counts = [1, 2, 3]
slime_cell = [1, 5]
enemy_column_offset = 5       # enemies stand in the column slime_cell.x + offset
enemy_rows = [5, 4, 6]        # the n-th enemy stands on this row
