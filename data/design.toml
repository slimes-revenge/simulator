# Design numbers for the simulator: every tunable value lives here, never in code.
# Source of truth today is the game code (slimes-revenge/SlimesRevenge, Assets/Scripts/Runtime);
# the comment on each block names the C# constant or field it mirrors.

[rules]
board_width = 10          # RunConfig: 10x10 grass
board_height = 10
vision_range = 5          # Creature.visionRange (Chebyshev, no walls)
dominance_percent = 60        # affinity threshold (balance liquids.md); the game uses 80 of the volume
dominance_basis = "capacity"  # share of the capacity (design); "volume" = of the body now (the game)
retaliation_pulses = 3        # Retaliation statuses last 3 pulses, a full status like a strike (design, Oleg 2026-11-26; fallback 2); 0 = the liquid's own duration (the game)
heavy = { Lava = 3, Mercury = 2 }  # holding this many costs 1 action point each (design)
heavy_min_action_points = 2   # heaviness never takes the slime below this
reaction_can_kill = true      # R1: a reaction chain may empty the body (balance sim-reactions-spec.md)
stone_rounds = 4              # a Water + Lava stone stands this many slime rounds
pursuit_memory_turns = 3  # Creature.PursuitMemoryTurns
max_rounds = 200          # simulator only: a fight that lasts longer is a loss with cause "timeout"
last_drop_strike = true       # agreed design rule (П15): at 1 unit a strike hits and spends nothing; not in the game yet
spit_range = 1                # level 2: spit reaches this far (Chebyshev); only 1 is modelled
regeneration_in_fight_only = true  # G3, agreed design rule: Regeneration only while an enemy is engaged; not in the game yet

[slime]
capacity = 10             # Volume.Capacity
speed = 1                 # Creature.speed default
# Slime.FillStarting, from the centre to the edge: the last unit is the edge, which strikes
# spend and hits pop first (rule S13).
start = ["Water", "Water", "Oil", "Poison", "Acid", "Lava"]

[statuses]
# OverTime.DefaultDuration for every timed status.
wet = 3
burning = 3
poisoned = 3
corroding = 3
instability = 3
flammable = 3
burning_pulse = 1          # Burning.PulsePower (before Flammable)
poisoned_pulse = 1         # Poisoned.PulsePower
corroding_pulse = 1        # Corroding.PulsePower (when no armor is left)
flammable_multiplier = 2   # Flammable.DamageMultiplier, per Flammable status
instability_speed = -1     # Instability.SpeedModifier
vampirism_heal = 2         # Vampirism.HealAmount
regeneration_growth = 1    # Regeneration: +1 Blood per pulse

# Liquids in this order are the fixed order of breakdowns in the report.
# power = Substance.Power, corrosion = Substance.Corrosion. What each liquid applies is a rule
# (src/model.rs), not a number.
[[liquids]]
name = "Water"
power = 1
corrosion = 0

[[liquids]]
name = "Oil"
power = 1
corrosion = 0

[[liquids]]
name = "Poison"
power = 1
corrosion = 0

[[liquids]]
name = "Acid"
power = 1
corrosion = 1

[[liquids]]
name = "Blood"
power = 1
corrosion = 0

[[liquids]]
name = "Lava"
power = 1
corrosion = 0

[[liquids]]
name = "Mercury"
power = 2                     # design (liquids.md); the game's Mercury hits for 1
corrosion = 0

# G5 (design rule, not in the game yet): an infected Blood unit, no power and no effect.
[[liquids]]
name = "Pus"
power = 0
corrosion = 0

# The rest of the 18 liquids (lore forum.md; rows: balance liquids.md "Финальный список").
# Vitriol: Corroding; Alkali: Instability 2; Sulfur: Flammable; Ambrosia heals Living. The rest
# strike for `power` with no status until their statuses exist (Cold fire, Greased, Rooted, Charmed).
[[liquids]]
name = "Phosphorus"
power = 1
corrosion = 0

[[liquids]]
name = "Aquavita"
power = 1
corrosion = 0

[[liquids]]
name = "Vitriol"
power = 1
corrosion = 0

[[liquids]]
name = "Alkali"
power = 1
corrosion = 0
pulses = 2                    # Instability 2 (liquids.md)

[[liquids]]
name = "Ambrosia"
power = 1
corrosion = 0

[[liquids]]
name = "Fat"
power = 1
corrosion = 0

[[liquids]]
name = "Resin"
power = 1
corrosion = 0

[[liquids]]
name = "Sulfur"
power = 1
corrosion = 0

[[liquids]]
name = "Tar"
power = 1
corrosion = 0

[[liquids]]
name = "Aphrodisiac"
power = 1
corrosion = 0

