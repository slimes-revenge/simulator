# A sample ladder (format and mechanics check; the balance session generates the real one):
# level 1 with a river and a middle room under the night sun, level 2 dry with drips, two city branches.
[[levels]]
id = "ladder-1"
capacity = 10
action_points = 2
policy = "strafe"
ladder = { level = 1, difficulty = "E" }
map = { rooms = 5, room_side = [5, 9], enemies_per_room = [1, 2], enemy_kinds = ["Bat", "Mushroom", "Undine"], corridor = 2, vision = 2, river = 6, river_liquids = ["Water"], surface_rooms = 1, sun_every = 2 }

