# The build x encounter matrix.
[matrix]
seeds = 50                    # seeds 0..seeds-1 per cell
action_points = [1, 2]        # 1 = the game today, 2 = the design (turn-structure.md)
pure_build_units = 10         # one pure build per build liquid
build_liquids = ["Water", "Oil", "Poison", "Acid", "Blood", "Lava", "Mercury"]
enemy_counts = [1, 2, 3]
slime_cell = [1, 5]
enemy_column_offset = 5       # enemies stand in the column slime_cell.x + offset
enemy_rows = [5, 4, 6]        # the n-th enemy stands on this row
policies = ["newcomer", "arranger", "kite", "reader"]  # slime policies the matrix runs

[policies]
lure_patience = 10            # actions `lure` waits per room approach while 2+ calm enemies would see it
arranger_keep = "none"        # the liquid `arranger` keeps deep (a liquid name), or "none"

# R1/R2 (balance sim-reactions-spec.md, lore forum.md): two circles; each liquid encourages the next.
[elements]
circles = [
  ["Water", "Phosphorus", "Lava", "Mercury", "Aquavita"],
  ["Vitriol", "Alkali", "Ambrosia", "Acid", "Poison"],
]
encouragement_bonus = 1       # once per slime turn: the unit under the edge encourages the edge
# R2 elements in combat (balance sim-reactions-spec.md, bestiary-numbers.md).
suppress = "plus1"            # a dominating hit: "plus1" (+1) or "double" (x2, fallback)
suppressed_hit_percent = 25   # a suppressed enemy's bite lands this often...
miss_self_damage = 1          # ...and a miss costs it this many HP
living = "Alkali"             # Living creatures: Ambrosia heals them 1 instead of hurting
# An enemy without `element`: its corpse's main liquid (circle liquids are their own element).
corpse = { Blood = "Alkali", Fat = "Alkali", Pus = "Poison", Oil = "Lava", Sulfur = "Acid", Resin = "Ambrosia", Tar = "Ambrosia" }
# Statuses that do not take on enemies of these elements (the strike still hurts).
status_immune = { Poisoned = ["Mercury", "Water", "Phosphorus", "Poison", "Lava"], Burning = ["Lava", "Water", "Mercury"], Corroding = ["Water", "Lava", "Acid", "Vitriol"], Instability = ["Ambrosia"] }
# Statuses that take twice on enemies of these elements.
status_double = { Corroding = ["Mercury"] }

# R1: neighbouring units (either order) that react at the end of the slime's turn.
[[reactions]]
pair = ["Water", "Lava"]
makes = []
stone = true

[[reactions]]
pair = ["Lava", "Aquavita"]
makes = []

[[reactions]]
pair = ["Poison", "Blood"]
makes = ["Pus", "Pus"]

[[reactions]]
pair = ["Alkali", "Acid"]
makes = ["Water"]

# Ladder pass rules (docs/ladder.md): a level passes when its end % is >= min (or <= max).
[ladder]
thresholds = [
  { difficulty = "E", policy = "strafe", min = 90 },
  { difficulty = "N", policy = "lure", min = 90 },
  { difficulty = "H", policy = "kite", min = 70 },
  { difficulty = "H", policy = "strafe", max = 10 },
]

# Level runs. A stage level (`stages`) carries the body through fights and fountains
# (src/level.rs); a map level (`map`) walks a generated chain of rooms to the exit (src/map.rs).
# Level runs for the body economy (src/level.rs, docs/report-format.md "[levels]").
# Placeholders until balance defines real levels: the same stages at 1 and 2 actions per round.
# `start` defaults to full Water. Stages: kind = "fight" (enemy, enemies at once) or
# kind = "fountain" (liquid, units; the slime drinks until full, the rest is lost).
[[levels]]
id = "sample-ap1"
capacity = 10
action_points = 1
policy = "newcomer"
stages = [
  { kind = "fight", enemy = "Mushroom", enemies = 1 },
  { kind = "fight", enemy = "Bat", enemies = 1 },
  { kind = "fountain", liquid = "Water", units = 3 },
  { kind = "fight", enemy = "Mushroom", enemies = 1 },
  { kind = "fight", enemy = "Eye", enemies = 2 },
]

[[levels]]
id = "sample-ap2"
capacity = 10
action_points = 2
policy = "newcomer"
stages = [
  { kind = "fight", enemy = "Mushroom", enemies = 1 },
  { kind = "fight", enemy = "Bat", enemies = 1 },
  { kind = "fountain", liquid = "Water", units = 3 },
  { kind = "fight", enemy = "Mushroom", enemies = 1 },
  { kind = "fight", enemy = "Eye", enemies = 2 },
]

