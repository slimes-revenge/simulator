name: ci

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Run the design guard
        run: cargo run --release -- --out design-guard.json
      - uses: actions/upload-artifact@v4
        with:
          name: design-guard
          path: design-guard.json

  publish:
    # The rolling `latest` release: the site downloads
    # https://github.com/slimes-revenge/simulator/releases/download/latest/design-guard.json
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: design-guard
      - name: Move the latest tag and upload the report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          notes="design-guard.json for dev at $GITHUB_SHA"
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --notes "$notes"
            gh release upload latest design-guard.json --clobber
          else
            gh release create latest design-guard.json --title "Design guard (dev)" --notes "$notes"
          fi
